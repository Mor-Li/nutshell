[project]
name = "nutshell-cli"
version = "0.1.0"
description = "Nutshell 终端版：在终端里跟 Gemini 纯聊天，拖文件进来自动附上内容"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "prompt_toolkit>=3.0",
    "pymupdf>=1.24",
    "pillow>=10",
    "tiktoken>=0.7",
    "rich>=15.0.0",
]

[project.scripts]
nutshell = "nutshell_cli.main:main"
nut = "nutshell_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nutshell_cli"]
