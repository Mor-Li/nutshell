<!doctype html>
<!-- README 顶上那张横幅。render.py --banner 把它截成 assets/banner-<lang>.png。?lang=zh 是中文版 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  #banner {
    position: relative; width: 1280px; height: 400px; overflow: hidden;
    background:
      radial-gradient(circle at 18% 50%, rgba(255,214,170,.55), rgba(255,214,170,0) 42%),
      radial-gradient(circle at 92% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 40%),
      linear-gradient(120deg, #f6efe6 0%, #efe3d3 55%, #e6d3bd 100%);
    display: flex; align-items: center; padding: 0 86px; gap: 56px;
  }
  /* 背景上淡淡的几个对话气泡，呼应图标 */
  .ghost { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); }
  .ghost::after { content: ""; position: absolute; left: 22%; bottom: -10%; width: 22%; height: 30%; background: inherit; transform: skewX(-30deg); }
  #icon { width: 236px; height: 236px; flex: none; filter: drop-shadow(0 20px 30px rgba(90,50,25,.28)); }
  h1 { margin: 0; font-size: 92px; line-height: 1; letter-spacing: -2.5px; color: #3a2417; font-weight: 800; }
  .tag { margin-top: 18px; font-size: 33px; line-height: 1.3; color: #5b3d2b; font-weight: 600; letter-spacing: -.3px; }
  .flow { margin-top: 26px; display: flex; align-items: center; gap: 12px; font-size: 19px; color: #7a5a45; font-weight: 600; }
  .flow kbd {
    font: inherit; font-size: 18px; padding: 7px 13px; border-radius: 10px; color: #3a2417;
    background: linear-gradient(#fffdfb, #f1e6da); box-shadow: 0 3px 0 #cdb7a2, inset 0 1px 0 #fff;
  }
  .flow .arrow { color: #b48b6c; font-size: 20px; }
</style>
</head>
<body>
<div id="banner">
  <div class="ghost" style="left:1040px;top:-40px;width:220px;height:150px"></div>
  <div class="ghost" style="left:1160px;top:250px;width:150px;height:100px;opacity:.6"></div>
  <img id="icon" src="../icon/AppIcon.png" alt="">
  <div>
    <h1>Nutshell</h1>
    <div class="tag" id="tag"></div>
    <div class="flow" id="flow"></div>
  </div>
</div>
<script>
  const zh = new URLSearchParams(location.search).get('lang') === 'zh';
  document.getElementById('tag').innerHTML = zh
    ? '看不懂的东西，复制一下，<br>鼠标旁边就用大白话给你讲明白。'
    : 'Copy anything you don’t get.<br>Get it in plain words, right by your cursor.';
  const steps = zh ? ['选中', '复制', '两指连点两下', '大白话解读'] : ['Select', 'Copy', 'Two-finger double-tap', 'Plain words'];
  const keys = [null, '⌘C', null, null];
  document.getElementById('flow').innerHTML = steps.map((s, i) =>
    (keys[i] ? `<kbd>${keys[i]}</kbd>` : '') + `<span>${s}</span>`).join('<span class="arrow">→</span>');
</script>
</body>
</html>
